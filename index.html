<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/e87d10dd99.js" crossorigin="anonymous"></script>
    <title>Snake Juego</title>
</head>

<body>
    <div id="pantalla">
        <div id="pantalla-inicio" class="salva-pantalla">
            <div>
                <p>INICIAR JUEGO</p>
                <button id="btn_play"><span class="fa-solid fa-play"></span></button>
            </div>
        </div>

        <div id="pantalla-gameover" class="salva-pantalla">
            <div>
                <p>GAME OVER</p>
                <p class="puntuacion">puntuación: <span id="puntaje">0</span></p>
                <button id="btn_return"><span class="fa-solid fa-arrow-rotate-left"></span></button>
            </div>
        </div>
    </div>

    <script>
        //crear casillas
        const casillas_totales = 2025;
        for (let i = 0; i < casillas_totales; i++) {
            let celda = document.createElement('div');
            celda.className = 'casilla';
            celda.style.width = '20px';
            celda.style.height = '20px';
            document.getElementById('pantalla').append(celda);
        }

        //identificar casillas para tener control individual
        let casilla_numero = 0;
        for (const casilla of document.querySelectorAll('.casilla')) {
            casilla.id = 'cn_' + casilla_numero++;
        }

        //generar la serpiente
        let posicion_cabeza = 130;
        let posicion_snake = [document.getElementById('cn_' + posicion_cabeza), document.getElementById('cn_131'), document.getElementById('cn_132')];
        function dibujarSnake() {
            //eliminar posicion anterior
            for (const casilla of document.querySelectorAll('.casilla')) {
                if (casilla.id === posicion_alimento) {
                } else {
                    casilla.innerHTML = '';
                }
            }

            //dibujar la posicion actual 
            for (const posicion of posicion_snake) {
                let snake_body = document.createElement('div');
                snake_body.id = 'snake';
                posicion.append(snake_body);
            }
        }

        //generar la ubicacion del alimento al azar
        let puntuacion = 0;
        let alimento = document.createElement('div')
        let posicion_alimento = '';
        alimento.id = 'alimento';

        function reubicarAlimento(casillas_ocupadas) {
            let casilla_aleatoria = '';
            do {
                let numero_aleatorio = Math.floor(Math.random() * casillas_totales);
                casilla_aleatoria = 'cn_' + numero_aleatorio;
            } while (casillas_ocupadas.includes(document.getElementById(casilla_aleatoria)) || bordes.includes(document.getElementById(casilla_aleatoria)))

            document.getElementById(casilla_aleatoria).append(alimento);
            if (velocidad > 30) {
                velocidad -= 5;
            }
            ajustarVelocidad();
            posicion_alimento = casilla_aleatoria;
        }

        //movimiento de la serpiente
        let velocidad = 105;
        let movimiento;
        let pos_izquierda = -1;
        let pos_derecha = +1;
        let pos_arriba = -45;
        let pos_abajo = +45;

        let direccion = pos_izquierda

        document.addEventListener('keydown', function (event) {
            let actual_posicion_cabeza = document.getElementById('cn_' + posicion_cabeza);

            switch (event.key) {
                case 'ArrowLeft':
                    if (direccion == pos_derecha) {
                        console.log('no puedes ir hacia la derecha');
                        break;
                    }
                    if (actual_posicion_cabeza != document.getElementById('cn_' + (posicion_cabeza + pos_izquierda))) {
                        direccion = pos_izquierda;
                    }
                    break;

                case 'ArrowRight':
                    if (direccion == pos_izquierda) {
                        console.log('no puedes ir hacia la izquierda');
                        break;
                    }
                    if (actual_posicion_cabeza != document.getElementById('cn_' + (posicion_cabeza + pos_derecha))) {
                        direccion = pos_derecha;
                    }
                    break;

                case 'ArrowUp':
                    if (direccion == pos_abajo) {
                        console.log('no puedes ir hacia arriba');
                        break;
                    }
                    if (actual_posicion_cabeza != document.getElementById('cn_' + (posicion_cabeza + pos_arriba))) {
                        direccion = pos_arriba;
                    }
                    break;

                case 'ArrowDown':
                    if (direccion == pos_arriba) {
                        console.log('no puedes ir hacia abajo');
                        break;
                    }
                    if (actual_posicion_cabeza != document.getElementById('cn_' + (posicion_cabeza + pos_izquierda))) {
                        direccion = pos_abajo;
                    }
                    break;
            }
            console.log(event.key);
        });

        function moverSnake() {
            autoComerse();
            contraLaPared();
            if (!gameOver) {
                let avanzar = document.getElementById('cn_' + (posicion_cabeza + direccion));
                posicion_snake.unshift(avanzar);
                posicion_cabeza += direccion;

                if ('cn_' + posicion_cabeza === posicion_alimento) {
                    reubicarAlimento(posicion_snake);
                    puntuacion++
                    document.getElementById('puntaje').textContent = puntuacion;
                } else {
                    posicion_snake.pop();
                }
                dibujarSnake();
            } else {
                console.log('gamer over')
                document.getElementById('pantalla-gameover').style.display = 'flex';
                document.getElementById('puntaje').textContent = puntuacion;
            }
        }
        function ajustarVelocidad() {
            clearInterval(movimiento);
            movimiento = setInterval(moverSnake, velocidad);
        }


        //colisiones
        let gameOver = true;
        let bordes = [];

        function autoComerse() {
            for (let i = 1; i < posicion_snake.length; i++) {
                if (document.getElementById('cn_' + posicion_cabeza) == posicion_snake[i]) {
                    gameOver = true;
                    break;
                }
            }
        }
        function generarBordes() {
            //borde superior
            for (let i = 0; i < 45; i++) {
                let borde = document.getElementById('cn_' + i);
                borde.classList.add('borde-tablero');
                bordes.push(borde);
            }
            //borde izquierdo
            for (let i = 0; i < 1981; i += 45) {
                let borde = document.getElementById('cn_' + i);
                borde.classList.add('borde-tablero');
                bordes.push(borde);
            }
            //borde inferior
            for (let i = 1980; i < 2025; i++) {
                let borde = document.getElementById('cn_' + i);
                borde.classList.add('borde-tablero');
                bordes.push(borde);
            }
            //borde derecho
            for (let i = 44; i < 2025; i += 45) {
                let borde = document.getElementById('cn_' + i);
                borde.classList.add('borde-tablero');
                bordes.push(borde);
            }
        }

        function contraLaPared() {
            for (const borde of bordes) {
                if (document.getElementById('cn_' + posicion_cabeza) == borde) {
                    gameOver = true;
                }
            }
        }

        //iniciar juego
        function iniciarJuego() {
            gameOver = false;
            document.getElementById('pantalla-inicio').style.display = 'none';
            generarBordes();
            reubicarAlimento(posicion_snake);
            dibujarSnake();
            ajustarVelocidad();
        }
        
        //reiniciar
        function reiniciar() {
            posicion_cabeza = 130;
            posicion_snake = [document.getElementById('cn_' + posicion_cabeza), document.getElementById('cn_131'), document.getElementById('cn_132')];
            puntuacion = 0;
            velocidad = 105;
            direccion = pos_izquierda;
            document.getElementById('pantalla-gameover').style.display = 'none'

            iniciarJuego();
        }

        document.getElementById('btn_play').onclick = iniciarJuego;
        document.getElementById('btn_return').onclick = reiniciar;
    </script>
</body>

</html>
